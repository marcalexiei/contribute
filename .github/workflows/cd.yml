name: CD (Deploy VitePress site to Pages)

on: # zizmor: ignore[dangerous-triggers]
  # region triggers
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  # endregion triggers
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Deploy pre check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      result: ${{ steps.gen_output.outputs.result }}

    steps:
      - id: gen_output
        # region condition
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
        # endregion condition
        run: |
          echo "result=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: ${{ needs.check.outputs.result }}

    needs:
      - check

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/.github/actions/setup-node-and-pnpm@6735bb9dd019900ebc16ce34e13c118b3917d1f7 # v1.2.0

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with VitePress
        run: pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - check
      - build

    if: ${{ needs.check.outputs.result }}

    permissions:
      contents: read
      pages: write # required to deploy to GitHub Pages
      id-token: write # required for OIDC authentication with GitHub Pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  failure:
    name: Failure
    runs-on: ubuntu-latest
    timeout-minutes: 1

    if: ${{ !needs.check.outputs.result }}

    needs:
      - check

    steps:
      - run: echo 'CI failed. Deploy will not run.'
