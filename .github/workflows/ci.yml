name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Run all checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2

      - name: Build
        run: pnpm run docs:build

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Spellcheck
        run: pnpm run spellcheck

  github-actions-audit:
    name: GitHub Actions audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # required to check out the repository
    steps:
      - name: Audit GitHub Actions
        uses: marcalexiei/github-actions/audit-github-actions@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2

  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: ${{ always() }}
    needs:
      - check
      - github-actions-audit
    permissions:
      actions: read # required to list the run's jobs
      contents: read # required to read the workflow file
    steps:
      - name: Check needed jobs
        uses: marcalexiei/github-actions/check-needs@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2
        with:
          needs: ${{ toJSON(needs) }}
