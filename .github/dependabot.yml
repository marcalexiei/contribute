version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    groups:
      pages:
        patterns:
          - 'actions/configure-pages'
          - 'actions/deploy-pages'
          - 'actions/upload-pages-artifact'
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    groups:
      dev-code-check:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '@marcalexiei/prettier-config'
          - 'cspell'
          - 'lefthook'
          - 'markdownlint'
          - 'markdownlint-cli'
          - 'prettier'

      build:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - 'vitepress'
    cooldown:
      default-days: 7
